<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110E"/>
      <stop offset="50%" stop-color="#1B1713"/>
      <stop offset="100%" stop-color="#241E18"/>
    </linearGradient>
    <linearGradient id="springGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DB33F"/>
      <stop offset="100%" stop-color="#4B8624"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B857"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#crudBg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#F3EEE5" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title container -->
  <rect x="70" y="50" width="660" height="395" rx="16" fill="#1A1613" stroke="rgba(200, 155, 60, 0.25)" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="70" y="50" width="660" height="44" rx="16" fill="#211B16"/>
  <rect x="70" y="80" width="660" height="14" fill="#211B16"/>
  <circle cx="96" cy="72" r="5" fill="#EF4444"/>
  <circle cx="112" cy="72" r="5" fill="#F59E0B"/>
  <circle cx="128" cy="72" r="5" fill="#10B981"/>
  <text x="150" y="77" fill="#AFA495" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Consolidated CRUD Operations — Spring Boot &amp; Hibernate</text>
  <rect x="580" y="63" width="135" height="20" rx="10" fill="url(#springGreen)" opacity="0.9"/>
  <text x="595" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">SPRING BOOT API</text>

  <!-- Layered Architecture Diagram -->
  <!-- Layer 1: Controller Layer -->
  <g transform="translate(100, 120)">
    <rect width="600" height="55" rx="10" fill="#211B16" stroke="#4C8577" stroke-width="1.5"/>
    <text x="25" y="32" fill="#6FC4B0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">Controller Layer</text>
    <text x="25" y="46" fill="#AFA495" font-family="sans-serif" font-size="11">EmployeeController, ProductController, AuthController (@RestController)</text>
    <rect x="490" y="16" width="90" height="24" rx="12" fill="#4C8577" fill-opacity="0.25"/>
    <text x="502" y="32" fill="#6FC4B0" font-family="sans-serif" font-size="11" font-weight="600">REST APIs</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="175" x2="400" y2="198" stroke="#C89B3C" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="395,198 400,205 405,198" fill="#C89B3C"/>

  <!-- Layer 2: Service Layer -->
  <g transform="translate(100, 205)">
    <rect width="600" height="55" rx="10" fill="#211B16" stroke="#C89B3C" stroke-width="1.5"/>
    <text x="25" y="32" fill="#E0B857" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">Service Layer</text>
    <text x="25" y="46" fill="#AFA495" font-family="sans-serif" font-size="11">Business Logic, Transaction Management &amp; Data Validation (@Service)</text>
    <rect x="490" y="16" width="90" height="24" rx="12" fill="#C89B3C" fill-opacity="0.25"/>
    <text x="508" y="32" fill="#E0B857" font-family="sans-serif" font-size="11" font-weight="600">Business</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="260" x2="400" y2="283" stroke="#C89B3C" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="395,283 400,290 405,283" fill="#C89B3C"/>

  <!-- Layer 3: DAO / Repository & Hibernate Layer -->
  <g transform="translate(100, 290)">
    <rect width="600" height="55" rx="10" fill="#211B16" stroke="#4C8577" stroke-width="1.5"/>
    <text x="25" y="32" fill="#6FC4B0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">Data Access / DAO Layer</text>
    <text x="25" y="46" fill="#AFA495" font-family="sans-serif" font-size="11">Hibernate ORM, Entity Mapping (@Entity), Spring Data JPA Repositories</text>
    <rect x="490" y="16" width="90" height="24" rx="12" fill="#4C8577" fill-opacity="0.25"/>
    <text x="505" y="32" fill="#6FC4B0" font-family="sans-serif" font-size="11" font-weight="600">Hibernate</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="345" x2="400" y2="368" stroke="#C89B3C" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="395,368 400,375 405,368" fill="#C89B3C"/>

  <!-- Layer 4: MySQL Database -->
  <g transform="translate(100, 375)">
    <rect width="600" height="50" rx="10" fill="#14110E" stroke="rgba(240, 227, 204, 0.2)" stroke-width="1.5"/>
    <text x="25" y="31" fill="#F3EEE5" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Database: MySQL Relational DB</text>
    <text x="25" y="44" fill="#AFA495" font-family="sans-serif" font-size="11">ACID Compliance, Foreign Keys, Indexed Tables &amp; Connection Pooling</text>
    <rect x="490" y="13" width="90" height="24" rx="12" fill="rgba(200, 155, 60, 0.2)"/>
    <text x="515" y="29" fill="#E0B857" font-family="sans-serif" font-size="11" font-weight="600">MySQL</text>
  </g>
</svg>
