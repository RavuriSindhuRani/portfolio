<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110E"/>
      <stop offset="50%" stop-color="#1F1A15"/>
      <stop offset="100%" stop-color="#16120E"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B857"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8A6724"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C8577"/>
      <stop offset="100%" stop-color="#6FC4B0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#certBg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="25" y="25" width="950" height="650" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="35" y="35" width="930" height="630" rx="12" fill="none" stroke="#C89B3C" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Corner Ornaments -->
  <g stroke="url(#goldBorder)" stroke-width="2" fill="none">
    <path d="M 45 65 L 65 65 L 65 45"/>
    <path d="M 955 65 L 935 65 L 935 45"/>
    <path d="M 45 635 L 65 635 L 65 655"/>
    <path d="M 955 635 L 935 635 L 935 655"/>
  </g>

  <!-- Organization Logo / Header -->
  <text x="500" y="130" text-anchor="middle" fill="#E0B857" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold" letter-spacing="4">DR. REDDY'S FOUNDATION</text>
  <text x="500" y="165" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="14" letter-spacing="2">CERTIFICATE OF COMPLETION</text>

  <!-- Subtitle -->
  <text x="500" y="230" text-anchor="middle" fill="#F3EEE5" font-family="serif" font-style="italic" font-size="20">This is proudly presented to</text>
  <text x="500" y="290" text-anchor="middle" fill="#F3EEE5" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="bold" letter-spacing="1">RAVURI SINDHURANI</text>

  <!-- Line -->
  <line x1="300" y1="315" x2="700" y2="315" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Program Details -->
  <text x="500" y="365" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="17">for successfully completing the comprehensive professional program in</text>
  <text x="500" y="420" text-anchor="middle" fill="url(#tealGrad)" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="bold">MERN Stack Development</text>
  
  <text x="500" y="470" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="15">Covering MongoDB, Express.js, React.js, Node.js, REST APIs, and Full-Stack Architecture</text>

  <!-- Badge Seal -->
  <g transform="translate(500, 560)">
    <circle r="46" fill="#211B16" stroke="url(#goldBorder)" stroke-width="3"/>
    <circle r="38" fill="none" stroke="#C89B3C" stroke-dasharray="4,3" stroke-width="1.5"/>
    <text y="-8" text-anchor="middle" fill="#E0B857" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1">VERIFIED</text>
    <text y="8" text-anchor="middle" fill="#F3EEE5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">MERN</text>
    <text y="22" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="8">CERTIFIED</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(180, 570)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(240, 227, 204, 0.3)" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="13">Authorized Signatory</text>
    <text x="90" y="42" text-anchor="middle" fill="#786E60" font-family="sans-serif" font-size="11">Dr. Reddy's Foundation</text>
  </g>

  <g transform="translate(640, 570)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(240, 227, 204, 0.3)" stroke-width="1"/>
    <text x="90" y="24" text-anchor="middle" fill="#AFA495" font-family="sans-serif" font-size="13">Program Director</text>
    <text x="90" y="42" text-anchor="middle" fill="#786E60" font-family="sans-serif" font-size="11">Technical Education</text>
  </g>
</svg>
